syntax = "proto3";

message PlayerIdentifier {
  string type = 1;
  string value = 2;
}

message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message Metadata {
  int64 timestamp = 1;
  string correlation_id = 2;
}

message PluginSendEnvelope {
  Metadata metadata = 1;

  oneof payload {
    PluginHandshakeEvent plugin_handshake_event = 10;
    ServerHealthEvent server_health_event = 11;
    PlayerVoiceEvent player_voice_event = 12;
    PlayerChatEvent player_chat_event = 13;
    PlayerJoinEvent player_join_event = 14;
    PlayerLeaveEvent player_leave_event = 15;
    PlayerTickEvent player_tick_event = 16;
    ServerPlayerSyncEvent server_player_sync_event = 17;
  }
}

message PluginReceiveEnvelope {
  Metadata metadata = 1;

  oneof payload {
    PluginHandshakeResponse plugin_handshake_response = 10;
    ServerPlayerSyncResponse server_player_sync_response = 11;
  }
}

message PluginHandshakeEvent {
  string game = 1;
  string version = 2;
  string token = 3;
}

message PluginHandshakeResponse {
  bool success = 1;
  string message = 2;
}

message ServerHealthEvent {
  int32 framerate = 1;
}

message PlayerVoiceEvent {
  PlayerIdentifier primary_player_identifier = 1;
  bytes raw = 2;
}

message PlayerChatEvent {
  PlayerIdentifier primary_player_identifier = 1;
  string channel = 2;
  string message = 3;
}

message PlayerJoinEvent {
  PlayerIdentifier primary_player_identifier = 1;
  repeated PlayerIdentifier additional_player_identifiers = 2;
}

message PlayerLeaveEvent {
  PlayerIdentifier primary_player_identifier = 1;
}

message PlayerTickEvent {
  PlayerIdentifier primary_player_identifier = 1;
  Vector3 position = 2;
  Vector3 rotation = 3;
  Vector3 velocity = 4;
}

message ServerPlayerSyncResponse {
  int32 chunks = 1;
}

message ServerPlayerSyncEvent {
  message Player {
    PlayerIdentifier primary_player_identifier = 1;
    repeated PlayerIdentifier additional_player_identifiers = 2;
  }

  repeated Player players = 1;
}

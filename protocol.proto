syntax = "proto3";

message PluginEnvelope {
  int64 timestamp = 1;
  string correlation_id = 2;

  oneof payload {
    PluginHandshakeRequest plugin_handshake_request = 10;
  }
}

message WorkerEnvelope {
  string correlation_id = 1;

  oneof payload {
    PluginHandshakeResponse plugin_handshake_response = 10;
  }
}

message PluginHandshakeRequest {
  string game = 1;
  string version = 2;
  string token = 3;
}

message PluginHandshakeResponse {
  bool success = 1;
  string message = 2;
}
